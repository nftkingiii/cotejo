# Cotejo miner on Railway, Beta TestNet. ${...} values are filled by entrypoint.sh.
redis:
  url: "${REDIS_URL}"
pocket_node:
  query_node_rpc_url: "${POCKET_RPC_URL}"
  query_node_grpc_url: "${POCKET_GRPC_URL}"
  chain_id: "${POCKET_CHAIN_ID}"
  grpc_insecure: false
keys:
  keys_file: "/keys/supplier-keys.yaml"
block_time_seconds: ${BLOCK_TIME_SECONDS}
# v0.1.0 sizes the master pool from GOMAXPROCS but the cache-refresh subpool
# from runtime.NumCPU() (host CPUs: 48 on Railway), so auto-sizing panics with
# "maxConcurrency cannot be greater than the parent pool's". Pin the master
# pool above NumCPU*8*0.15 to keep the subpool inside it.
worker_pools:
  master_pool_size: 64
metrics:
  enabled: true
  addr: "0.0.0.0:9092"
logging:
  level: "info"
  format: "json"
